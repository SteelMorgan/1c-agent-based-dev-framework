    server: 1c-mcp
    tool: validate_query
    skill: framework/skills/tool-usage/platform-data/platform-data-core

  execute_query:
    kind: mcp
    server: 1c-mcp
    tool: execute_query
    skill: framework/skills/tool-usage/platform-data/platform-data-core

  parse_nav_link:
    kind: mcp
    server: 1c-mcp
    tool: parse_nav_link
    skill: framework/skills/tool-usage/platform-data/platform-data-core

  get_nav_link:
    kind: mcp
    server: 1c-mcp
    tool: get_nav_link
    skill: framework/skills/tool-usage/platform-data/platform-data-core

  # ───────────────────────────────────────────────────────
  # 1c-platform-context — справочник синтаксиса и API платформы
