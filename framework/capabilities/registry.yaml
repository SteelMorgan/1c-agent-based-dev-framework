    server: v8-session-manager
    tool: wait_for
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  # ───────────────────────────────────────────────────────
  # v8-runner — CLI-операции над проектом 1С
  # Полный список команд и аргументов — в SKILL.md и references/.
  # ───────────────────────────────────────────────────────
  build_project:
    kind: cli
    runner: v8-runner
    command: "v8-runner build"
    skill: framework/skills/tool-usage/v8-runner

  full_rebuild_project:
    kind: cli
    runner: v8-runner
    command: "v8-runner build --full-rebuild"
    skill: framework/skills/tool-usage/v8-runner

  init_infobase:
    kind: cli
    runner: v8-runner
    command: "v8-runner init"
    skill: framework/skills/tool-usage/v8-runner

  config_init:
    kind: cli
    runner: v8-runner
    command: "v8-runner config init"
    skill: framework/skills/tool-usage/v8-runner

  syntax_check_designer_modules:
    kind: cli
    runner: v8-runner
    command: "v8-runner syntax designer-modules"
    skill: framework/skills/tool-usage/code-analysis/syntax-checking

  syntax_check_designer_config:
    kind: cli
    runner: v8-runner
    command: "v8-runner syntax designer-config"
    skill: framework/skills/tool-usage/code-analysis/syntax-checking

  syntax_check_edt:
    kind: cli
    runner: v8-runner
    command: "v8-runner syntax edt"
    skill: framework/skills/tool-usage/code-analysis/syntax-checking

  run_yaxunit:
    kind: cli
    runner: v8-runner
    command: "v8-runner test yaxunit"
    skill: framework/skills/tool-usage/v8-runner

  run_vanessa:
    kind: cli
    runner: v8-runner
    command: "v8-runner test va"
    skill: framework/skills/tool-usage/vanessa/vanessa-authoring

  dump_config:
    kind: cli
    runner: v8-runner
    command: "v8-runner dump"
    skill: framework/skills/tool-usage/v8-runner

  load_artifact:
    kind: cli
    runner: v8-runner
    command: "v8-runner load"
    skill: framework/skills/tool-usage/v8-runner

  make_artifacts:
    kind: cli
    runner: v8-runner
    command: "v8-runner make"
    skill: framework/skills/tool-usage/v8-runner

  convert_sources:
    kind: cli
    runner: v8-runner
    command: "v8-runner convert"
    skill: framework/skills/tool-usage/v8-runner

  launch_designer:
    kind: cli
    runner: v8-runner
    command: "v8-runner launch designer"
    skill: framework/skills/tool-usage/v8-runner

  launch_thin_client:
    kind: cli
    runner: v8-runner
    command: "v8-runner launch thin"
    skill: framework/skills/tool-usage/v8-runner

  launch_mcp_client:
    kind: cli
    runner: v8-runner
    command: "v8-runner launch mcp --mode <thin|thick|ordinary> [--mcp-transport ws|legacy|auto] [--manager-url ws://...]"
    skill: framework/skills/tool-usage/v8-runner
    notes: «entry-point фиксирует `kind` на стороне клиента, переопределение из CLI запрещено»

  run_session_manager:
    kind: cli
    runner: v8-runner
    command: "v8-runner session-manager"
    skill: framework/skills/tool-usage/v8-session-manager
    notes: «встроенный в v8-runner запуск менеджера; в production используется external бинарь v8-session-manager»

  extensions_update:
    kind: cli
    runner: v8-runner
    command: "v8-runner extensions"
    skill: framework/skills/tool-usage/v8-runner
