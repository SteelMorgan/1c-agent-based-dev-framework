# Capability registry — связь стабильных capability-имён с их реализацией.
#
# Назначение:
#   - Прикладные навыки ссылаются на capability по имени (frontmatter `uses_capabilities`).
#   - Реализующие навыки декларируют, какие capability они поставляют
#     (frontmatter `provides_capabilities`).
#   - Этот файл резолвит capability → server/tool (для MCP) или runner/command (для CLI).
#
# Резолв описан в framework/rules/capability-resolution.md.
#
# Тип реализации:
#   kind: mcp  — MCP-сервер + tool. Схема аргументов берётся из tools/list соответствующего сервера.
#   kind: cli  — CLI-команда. Точный синтаксис и подсказки — в навыке (skill).
#
# Универсальные поля:
#   skill — путь к SKILL.md, объясняющему как пользоваться capability.
#   notes — необязательный комментарий: ограничения, рантайм-зависимости, deprecated.
#
# MCP-поля:
#   server, tool — имя MCP-сервера и tool в нём.
#
# CLI-поля:
#   runner   — бинарь (например, v8-runner).
#   command  — шаблон команды (без аргументов окружения, аргументы — в SKILL.md).
#
# Редактирование: вручную либо через `python tools/capability-registry.py`.
# Не дублировать одну и ту же capability на разные сервера: для конкурирующих реализаций
# (например `execute_query` через 1c-mcp vs через расширение в v8-session-manager) выбирается
# один основной источник, остальные документируются как fallback в SKILL.md.

capabilities:

  # ───────────────────────────────────────────────────────
  # BSL / LSP — навигация, диагностика, рефакторинг
  # ───────────────────────────────────────────────────────
  navigate_symbol:
    kind: mcp
    server: lsp-bsl-bridge
    tool: navigate_symbol
    skill: framework/skills/tool-usage/code-analysis/code-navigation

  get_call_graph:
    kind: mcp
    server: lsp-bsl-bridge
    tool: get_call_graph
    skill: framework/skills/tool-usage/code-analysis/code-navigation

  get_diagnostics:
    kind: mcp
    server: lsp-bsl-bridge
    tool: get_diagnostics
    skill: framework/skills/tool-usage/code-analysis/syntax-checking

  get_code_actions:
    kind: mcp
    server: lsp-bsl-bridge
    tool: get_code_actions
    skill: framework/skills/tool-usage/code-analysis/code-navigation

  rename_symbol:
    kind: mcp
    server: lsp-bsl-bridge
    tool: rename_symbol
    skill: framework/skills/tool-usage/code-analysis/code-navigation

  search_ssl_functions:
    kind: mcp
    server: lsp-bsl-bridge
    tool: search_ssl_functions
    skill: framework/skills/tool-usage/code-analysis/code-navigation

  # ───────────────────────────────────────────────────────
  # 1c-mcp — метаданные, запросы, навигационные ссылки.
  # Эти tools полностью серверные (чтение метаданных, запросы к БД, парсинг ссылок),
  # клиентский контекст им не нужен → реализация через стационарный MCP-сервер 1c-mcp,
  # БЕЗ зависимости от подключённого 1С-клиента. Расширение `mcp_tools` дублирует ту же
  # функциональность через session-manager, но в registry оно НЕ зарегистрировано —
  # витрина session-manager оставляется только для tools, которым нужен клиентский контекст.
  # ───────────────────────────────────────────────────────
  list_metadata_objects:
    kind: mcp
    server: 1c-mcp
    tool: list_metadata_objects
    skill: framework/skills/tool-usage/platform-data/metadata-discovery

  get_metadata_structure:
    kind: mcp
    server: 1c-mcp
    tool: get_metadata_structure
    skill: framework/skills/tool-usage/platform-data/metadata-discovery

  validate_query:
    kind: mcp
    server: 1c-mcp
    tool: validate_query
    skill: framework/skills/tool-usage/platform-data/query-execution

  execute_query:
    kind: mcp
    server: 1c-mcp
    tool: execute_query
    skill: framework/skills/tool-usage/platform-data/query-execution

  parse_nav_link:
    kind: mcp
    server: 1c-mcp
    tool: parse_nav_link
    skill: framework/skills/tool-usage/platform-data/nav-link

  get_nav_link:
    kind: mcp
    server: 1c-mcp
    tool: get_nav_link
    skill: framework/skills/tool-usage/platform-data/nav-link

  # ───────────────────────────────────────────────────────
  # 1c-platform-context — справочник синтаксиса и API платформы
  # ───────────────────────────────────────────────────────
  search_syntax_reference:
    kind: mcp
    server: 1c-platform-context
    tool: search
    skill: framework/skills/tool-usage/code-analysis/code-verification

  getMembers:
    kind: mcp
    server: 1c-platform-context
    tool: getMembers
    skill: framework/skills/tool-usage/code-analysis/code-verification

  getMember:
    kind: mcp
    server: 1c-platform-context
    tool: getMember
    skill: framework/skills/tool-usage/code-analysis/code-verification

  getConstructors:
    kind: mcp
    server: 1c-platform-context
    tool: getConstructors
    skill: framework/skills/tool-usage/code-analysis/code-verification

  # ───────────────────────────────────────────────────────
  # 1c-log-checker — журнал регистрации и техжурнал
  # ───────────────────────────────────────────────────────
  search_event_log:
    kind: mcp
    server: 1c-log-checker
    tool: logc_get_event_log
    skill: framework/skills/tool-usage/diagnostics/event-log-analysis

  search_tech_log:
    kind: mcp
    server: 1c-log-checker
    tool: logc_get_tech_log
    skill: framework/skills/tool-usage/diagnostics/tech-log-analysis

  configure_tech_log:
    kind: mcp
    server: 1c-log-checker
    tool: logc_configure_techlog
    skill: framework/skills/tool-usage/diagnostics/tech-log-analysis

  logc_get_techlog_config:
    kind: mcp
    server: 1c-log-checker
    tool: logc_get_techlog_config
    skill: framework/skills/tool-usage/diagnostics/tech-log-analysis

  logc_save_techlog:
    kind: mcp
    server: 1c-log-checker
    tool: logc_save_techlog
    skill: framework/skills/tool-usage/diagnostics/tech-log-analysis

  logc_restore_techlog:
    kind: mcp
    server: 1c-log-checker
    tool: logc_restore_techlog
    skill: framework/skills/tool-usage/diagnostics/tech-log-analysis

  logc_disable_techlog:
    kind: mcp
    server: 1c-log-checker
    tool: logc_disable_techlog
    skill: framework/skills/tool-usage/diagnostics/tech-log-analysis

  logc_get_actual_log_timestamp:
    kind: mcp
    server: 1c-log-checker
    tool: logc_get_actual_log_timestamp
    skill: framework/skills/tool-usage/diagnostics/event-log-analysis

  # ───────────────────────────────────────────────────────
  # 1c-copilot-proxy — Buddy (AI-консультант по 1С)
  # ───────────────────────────────────────────────────────
  ask_ai_assistant:
    kind: mcp
    server: 1c-copilot-proxy
    tool: ask_1c_ai
    skill: framework/skills/tool-usage/code-analysis/buddy-prompting

  # ───────────────────────────────────────────────────────
  # infostart-kb — база знаний сообщества 1С
  # ───────────────────────────────────────────────────────
  infostart_find_solution:
    kind: mcp
    server: infostart-kb
    tool: find_solution
    skill: framework/skills/tool-usage/infostart-kb

  infostart_how_to:
    kind: mcp
    server: infostart-kb
    tool: how_to
    skill: framework/skills/tool-usage/infostart-kb

  infostart_troubleshoot:
    kind: mcp
    server: infostart-kb
    tool: troubleshoot
    skill: framework/skills/tool-usage/infostart-kb

  infostart_report_result:
    kind: mcp
    server: infostart-kb
    tool: report_result
    skill: framework/skills/tool-usage/infostart-kb

  # ───────────────────────────────────────────────────────
  # chrome-devtools — браузерная автоматизация
  # ───────────────────────────────────────────────────────
  browser_navigate:
    kind: mcp
    server: chrome-devtools
    tool: navigate_page
    skill: framework/skills/tool-usage/browser-ui/playwright

  browser_snapshot:
    kind: mcp
    server: chrome-devtools
    tool: take_snapshot
    skill: framework/skills/tool-usage/browser-ui/playwright

  browser_fill:
    kind: mcp
    server: chrome-devtools
    tool: fill
    skill: framework/skills/tool-usage/browser-ui/playwright

  browser_click:
    kind: mcp
    server: chrome-devtools
    tool: click
    skill: framework/skills/tool-usage/browser-ui/playwright

  browser_take_screenshot:
    kind: mcp
    server: chrome-devtools
    tool: take_screenshot
    skill: framework/skills/tool-usage/browser-ui/screenshot

  browser_console_messages:
    kind: mcp
    server: chrome-devtools
    tool: list_console_messages
    skill: framework/skills/tool-usage/browser-ui/playwright

  browser_wait_for:
    kind: mcp
    server: chrome-devtools
    tool: wait_for
    skill: framework/skills/tool-usage/browser-ui/playwright

  # ───────────────────────────────────────────────────────
  # v8-session-manager — встроенные tools менеджера
  # Описание витрины и naming (v2 — голые имена) — в SKILL.md менеджера.
  # ───────────────────────────────────────────────────────
  session_list:
    kind: mcp
    server: v8-session-manager
    tool: session_list
    skill: framework/skills/tool-usage/v8-session-manager

  # ───────────────────────────────────────────────────────
  # v8-session-manager → tools, проксируемые подключёнными 1С-клиентами.
  # Доступны только пока соответствующий 1С-клиент подключён к менеджеру.
  # Источник tool (конкретное расширение 1С) — в SKILL.md провайдера в exts/<extension>/.
  # ───────────────────────────────────────────────────────

  # --- client_mcp / system management ---
  infobase_info:
    kind: mcp
    server: v8-session-manager
    tool: infobase_info
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `client_mcp`

  system_spawn_1c_client:
    kind: mcp
    server: v8-session-manager
    tool: system_spawn_1c_client
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `client_mcp`

  system_kill_pid:
    kind: mcp
    server: v8-session-manager
    tool: system_kill_pid
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `client_mcp`

  timer:
    kind: mcp
    server: v8-session-manager
    tool: Timer
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `client_mcp`; имя tool регистрозависимо

  # --- test_client: управление UI 1С через тест-клиент ---
  test_client_start:
