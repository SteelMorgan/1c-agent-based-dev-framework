    notes: provided by ext `test_client`

  ui_find:
    kind: mcp
    server: v8-session-manager
    tool: find
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  ui_open_form:
    kind: mcp
    server: v8-session-manager
    tool: open_form
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  ui_activate:
    kind: mcp
    server: v8-session-manager
    tool: activate
    skill: framework/skills/tool-usage/v8-session-manager
