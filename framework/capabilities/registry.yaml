    notes: provided by ext `test_client`

  ui_input:
    kind: mcp
    server: v8-session-manager
    tool: input
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  ui_select:
    kind: mcp
    server: v8-session-manager
    tool: select
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  ui_select_row:
    kind: mcp
    server: v8-session-manager
    tool: select_row
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  ui_get_value:
    kind: mcp
    server: v8-session-manager
    tool: get_value
    skill: framework/skills/tool-usage/v8-session-manager
    notes: provided by ext `test_client`

  ui_get_cell_value:
